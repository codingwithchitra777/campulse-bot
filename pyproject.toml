[project]
name = "campulse-bot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "requests",
    "cachetools",
    "python-telegram-bot[job-queue]",
    "pydantic",
    "matplotlib",
    "pytz",
    "aiohttp",
    "psycopg2-binary",
    "logfire",
]

[tool.uv]
package = false

[tool.logfire]
ignore_no_config = true
