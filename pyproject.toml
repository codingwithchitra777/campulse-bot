[project]
name = "campulse-bot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "requests",
    "cachetools",
    "python-telegram-bot[job-queue]",
    "pydantic",
    "matplotlib",
    "pytz",
    "aiohttp",
    "psycopg2-binary",
    "logfire",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "soundfile>=0.14.0",
    "scipy>=1.18.1",
    "numpy>=2.5.4",
]

[tool.uv]
package = false

[tool.logfire]
ignore_no_config = true
